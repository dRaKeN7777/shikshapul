name: shikshapul
description: Offline AI Entrance Exam Preparation for Nepal
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.4.9
  intl: ^0.18.1
  fl_chart: ^0.66.0
  llama_flutter_android: ^0.2.6
  connectivity_plus: ^7.3.1
  share_plus: ^13.3.0
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/shikshapul_logo.png
    # Keep the 412 MB GGUF out of the default Lite APK. The Full-AI Android
    # flavor adds it as a native streaming asset; both flavors retain metadata.
    - assets/models/model_manifest.json
